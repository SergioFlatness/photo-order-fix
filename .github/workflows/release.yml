name: Release bundle

# Builds the signed .aab to upload to Google Play. Run it from the Actions tab ("Run workflow").
# Needs two repository secrets: RELEASE_KEYSTORE_BASE64 (the upload keystore, base64) and
# RELEASE_KEYSTORE_PASSWORD.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Test date and ordering logic
        run: ./gradlew -p core test --console=plain

      - name: Build the signed bundle
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:bundleRelease --console=plain

      - name: Check the signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: photo-order-fix-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
