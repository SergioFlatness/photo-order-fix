name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test date and ordering logic
        run: ./gradlew -p core test --console=plain

      - name: Build the app
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-order-fix-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Every change on main replaces the "latest" test build, downloadable without a GitHub login:
      # https://github.com/<owner>/<repo>/releases/download/latest/photo-order-fix.apk
      - name: Publish the latest test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk photo-order-fix.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest photo-order-fix.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest test build" \
            --notes "Test build from commit $GITHUB_SHA. Requires Android 11 or newer."
